<section id="portfolio" class="section portfolio-section">
    <h2>Portfolio</h2>
    
    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button 
        class="filter-btn" 
        [class.active]="activeFilter === 'all'"
        (click)="filterProjects('all')">
        <i class="bi bi-grid-3x3-gap"></i> All Projects
      </button>
      <button 
        class="filter-btn" 
        [class.active]="activeFilter === 'ml-ai'"
        (click)="filterProjects('ml-ai')">
        <i class="bi bi-cpu"></i> ML/AI
      </button>
      <button 
        class="filter-btn" 
        [class.active]="activeFilter === 'software'"
        (click)="filterProjects('software')">
        <i class="bi bi-code-slash"></i> Software
      </button>
      <button 
        class="filter-btn" 
        [class.active]="activeFilter === 'full-stack'"
        (click)="filterProjects('full-stack')">
        <i class="bi bi-layers"></i> Full Stack
      </button>
    </div>

    <div class="portfolio-container">
      <div class="portfolio-item" *ngFor="let project of projects" (click)="openModal(project)">
        <div class="portfolio-image-wrapper">
          <img [src]="project.image" [alt]="project.title" class="portfolio-image" />
          <div class="portfolio-title-overlay">
            <h3>{{ project.title }}</h3>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Project Modal -->
    <div class="portfolio-modal" [class.active]="selectedProject" *ngIf="selectedProject">
      <div class="modal-content">
        <span class="close-modal" (click)="closeModal()">&times;</span>
        <div class="modal-flex-container">
          <div class="modal-carousel-section">
            <div class="carousel-container">
              <div class="carousel-track">
                <img *ngFor="let slide of selectedProject?.slides; let i = index" 
                     [src]="slide" 
                     [alt]="selectedProject?.title" 
                     class="carousel-slide"
                     [class.active]="i === currentSlideIndex"
                     [style.display]="i === currentSlideIndex ? 'block' : 'none'">
              </div>
              <div class="carousel-indicators">
                <span *ngFor="let slide of selectedProject?.slides; let i = index" 
                      class="indicator" 
                      [class.active]="i === currentSlideIndex"
                      (click)="goToSlide(i)"></span>
              </div>
              <div class="carousel-nav carousel-prev" (click)="previousSlide()">
                <i class="bi bi-chevron-left"></i>
              </div>
              <div class="carousel-nav carousel-next" (click)="nextSlide()">
                <i class="bi bi-chevron-right"></i>
              </div>
              <div class="carousel-play-pause" (click)="toggleAutoPlay()">
                <i class="bi" [class.bi-play-fill]="!isAutoPlaying" [class.bi-pause-fill]="isAutoPlaying"></i>
              </div>
            </div>
          </div>
          <div class="modal-text-section">
            <h3>{{ selectedProject?.title }}</h3>
            <ul>
              <li><strong>Project URL</strong>: <a [href]="selectedProject?.githubUrl" target="_blank">{{ selectedProject?.title }} Project</a></li>
            </ul>
            <p>{{ selectedProject?.description }}</p>
            <p>Key highlights:</p>
            <ul>
              <li *ngFor="let highlight of selectedProject?.highlights">{{ highlight }}</li>
            </ul>
            <p><strong>Impact:</strong> {{ selectedProject?.impact }}</p>
          </div>
        </div>
      </div>
    </div>
  </section>
