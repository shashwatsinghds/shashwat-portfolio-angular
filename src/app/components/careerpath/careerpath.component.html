<section id="career-path" class="section career-path-section">
    <h2 style="position: relative; display: inline-block; padding-bottom: 10px; color: var(--main-blue); font-size: 2rem; font-weight: 600;">Career Path</h2>
    <div class="timeline">
      <div class="timeline-progress"></div>
      <div class="timeline-item" 
           *ngFor="let item of timelineItems; let i = index" 
           [class.left]="item.position === 'left'"
           [class.right]="item.position === 'right'">
        <div class="timeline-connector"></div>
        <div class="timeline-image" [class]="item.imageClass">
          <img [src]="item.image" [alt]="item.title" (error)="onImageError($event)">
        </div>
        <div class="timeline-content">
          <h3>{{ item.title }}</h3>
          <h4>{{ item.subtitle }}</h4>
          <p>{{ item.period }}</p>
        </div>
      </div>
    </div>
    
  </section>
