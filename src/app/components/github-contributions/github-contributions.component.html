<section id="github-contributions" class="section github-contributions-section">
  <div class="github-inner">
    <div class="section-heading" appScrollReveal>
      <h2>GitHub Contributions</h2>
    </div>
    <p class="github-subtitle">
      Hover over squares to see details &bull; Click to view on GitHub
    </p>
    <div class="github-chart-wrapper glass-card">
      <div id="ghcal">
        <p>Loading GitHub contributions...</p>
      </div>
    </div>
    <div class="contribution-legend">
      <span class="legend-label">Less</span>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #161b22;"></div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #0e4429;"></div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #006d32;"></div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #26a641;"></div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #39d353;"></div>
      </div>
      <span class="legend-label">More</span>
    </div>
    <div id="gh-tooltip" class="tooltip"></div>
  </div>
</section>
