<section id="github-contributions" class="section github-contributions-section">
    <h2>GitHub Contributions</h2>
    <p style="text-align: center; color: #666; margin-bottom: 20px;">
        Hover over squares to see details • Click to view on GitHub
    </p>
    <div id="ghcal">
        <p>Loading GitHub contributions...</p>
    </div>
    <div class="contribution-legend">
        
        <div class="legend-item">
            <div class="legend-color" style="background-color: #ebedf0;"></div>
            <span>0</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #c6e48b;"></div>
            <span>1-3</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #7bc96f;"></div>
            <span>4-6</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #239a3b;"></div>
            <span>7-9</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #196127;"></div>
            <span>10+</span>
        </div>
        
    </div>
    <div id="gh-tooltip" class="tooltip"></div>
</section>
